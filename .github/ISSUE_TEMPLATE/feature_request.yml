name: Feature request
description: Propose a change to Cadence. Describe the problem before the solution.
title: "[feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal. Start from the problem: what is hard today,
        and for whom. Check the known limitations in `CHANGELOG.md` before
        filing. A new runtime dependency needs an explicit maintainer decision
        before implementation.

        **Do not use this form for a security vulnerability.** Follow
        `SECURITY.md` and report privately through GitHub Security Advisories.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Cadence would change?
      options:
        - cadence_shared (schemas, sync protocol, GitStore, LLM client)
        - cadence_daemon (watcher, commit queue, socket API, doc automation)
        - cadence_server (Phoenix web UI, sync API, proposals, actions)
        - cadence.nvim (Neovim plugin)
        - Documentation (spec, guides, release notes)
        - Cross-cutting / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what is painful? Describe the use case rather than the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behavior you want, which apps it touches, and any spec section it would change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other designs or workarounds, and why the current behavior is not enough.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Scope and impact
      description: Does this need a new dependency (spec §11), a database migration, a CAD_* config variable, or a decision recorded in spec §16? Is it backward compatible?
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and the known limitations in CHANGELOG.md.
          required: true
        - label: This is not a security vulnerability; security reports go through SECURITY.md.
          required: true
        - label: I am willing to implement or test this change.
          required: false
