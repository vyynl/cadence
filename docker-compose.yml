# One-command demo stack: Postgres + a seeded, dev-mode Cadence server.
#
#   docker compose up --build
#
# Not production: the image is MIX_ENV=dev and the password strategy is a
# build-time demo gate (spec §7.4, §12.4). The socket proxy allowlists only the
# endpoints the action runner uses (spec §8.4); CAD_ACTIONS_ENABLED and the
# limits still gate every run.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadence_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadence_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - cadence-demo-pg:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
      args:
        CAD_DEMO_AUTH: "true"
    depends_on:
      db:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      CAD_DATABASE_URL: "ecto://postgres:postgres@db:5432/cadence_demo"
      CAD_SECRET_KEY_BASE: "cadence-demo-secret-key-base-do-not-use-in-production-0123456789abcdef"
      CAD_PUBLIC_URL: "http://localhost:4000"
      CAD_GIT_STORE_PATH: "/data/git"
      CAD_ARTIFACT_PATH: "/data/artifacts"
      CAD_DOCKER_SOCKET: "http://docker-proxy:2375"
      CAD_ACTIONS_VOLUME: "cadence-demo-actions"
      CAD_ACTIONS_VOLUME_PATH: "/data/actions"
      CAD_DEMO_AUTH: "true"
      CAD_HTTP_PORT: "4000"
      # Local demo only: localhost is a secure context, so WebAuthn works over
      # plain HTTP. Production stays opt-in with an explicit https origin
      # (docs/passkeys.md).
      CAD_WEBAUTHN_ENABLED: "true"
      CAD_WEBAUTHN_RP_ID: "localhost"
      CAD_WEBAUTHN_ORIGIN: "http://localhost:4000"
    ports:
      - "4000:4000"
    volumes:
      # Style iteration: edit CSS on the host and refresh the browser.
      - ./apps/cadence_server/priv/static/css:/app/apps/cadence_server/priv/static/css
      - cadence-demo-git:/data/git
      # Actions: the server stages snapshots here and the host daemon mounts
      # the same named volume into each action container by subpath (§8.3).
      - cadence-demo-actions:/data/actions
      - cadence-demo-artifacts:/data/artifacts

  # Allowlisted Docker API proxy (spec §8.4). The runner only needs container
  # lifecycle, image inspect/build, and POST for wait/start.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      BUILD: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  cadence-demo-pg:
  cadence-demo-git:
  # Pinned so the Docker volume name matches CAD_ACTIONS_VOLUME; compose would
  # otherwise prefix both with the project name.
  cadence-demo-actions:
    name: cadence-demo-actions
  cadence-demo-artifacts:
    name: cadence-demo-artifacts
