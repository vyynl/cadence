# Production reference stack (spec §12.4, §12.7, §12.8).
#
# Fastest path (generates .env and starts the stack):
#   ./scripts/setup-prod.sh cadence.example.com you@example.com --up
#
# Manual:
#   docker compose -f docker-compose.prod.yml --profile tls up -d --build
#
# The one-shot `migrate` service applies migrations with
# `Cadence.Server.Release.migrate/0`; `bootstrap` creates the first account from
# CAD_ADMIN_* (a no-op when unset). The app starts only after both exit 0.
# The `tls` profile adds Caddy; omit it when an external proxy terminates TLS.
# The dev demo stack is `docker-compose.yml` (MIX_ENV=dev, demo auth). It uses
# the default project name (`cadence`), so this stack gets its own: `down` here
# must never touch the demo containers/volumes.
name: cadence-prod

x-cadence-env: &cadence-env
  CAD_PHX_HOST: "${CAD_PHX_HOST:?set CAD_PHX_HOST}"
  CAD_PUBLIC_URL: "${CAD_PUBLIC_URL:?set CAD_PUBLIC_URL}"
  CAD_SECRET_KEY_BASE: "${CAD_SECRET_KEY_BASE:?set CAD_SECRET_KEY_BASE}"
  # The reference stack builds the URL from the same values the postgres
  # service reads, so the two can never drift. An external database needs a
  # compose override that sets CAD_DATABASE_URL explicitly.
  CAD_DATABASE_URL: "ecto://${CAD_DB_USER:?set CAD_DB_USER}:${CAD_DB_PASS:?set CAD_DB_PASS}@postgres:5432/${CAD_DB_NAME:-cadence}"
  CAD_DB_POOL_SIZE: "${CAD_DB_POOL_SIZE:-10}"
  CAD_GIT_STORE_PATH: "/data/git"
  CAD_ARTIFACT_PATH: "/data/artifacts"
  CAD_ACTIONS_ENABLED: "${CAD_ACTIONS_ENABLED:-true}"
  CAD_ACTIONS_VOLUME: "${CAD_ACTIONS_VOLUME:-cadence_actions}"
  CAD_ACTIONS_VOLUME_PATH: "/data/actions"
  CAD_DOCKER_SOCKET: "http://docker-proxy:2375"
  CAD_LLM_PROVIDER: "${CAD_LLM_PROVIDER:-deepseek}"
  CAD_LLM_API_KEY: "${CAD_LLM_API_KEY:-}"
  CAD_LLM_MODEL: "${CAD_LLM_MODEL:-deepseek-chat}"
  CAD_LLM_BASE_URL: "${CAD_LLM_BASE_URL:-https://api.deepseek.com}"
  CAD_OAUTH_GITHUB_CLIENT_ID: "${CAD_OAUTH_GITHUB_CLIENT_ID:-}"
  CAD_OAUTH_GITHUB_CLIENT_SECRET: "${CAD_OAUTH_GITHUB_CLIENT_SECRET:-}"
  CAD_OAUTH_GOOGLE_CLIENT_ID: "${CAD_OAUTH_GOOGLE_CLIENT_ID:-}"
  CAD_OAUTH_GOOGLE_CLIENT_SECRET: "${CAD_OAUTH_GOOGLE_CLIENT_SECRET:-}"

services:
  # One-shot migration runner. `docker compose up` recreates it on every start;
  # it is idempotent and only touches the database.
  migrate:
    image: "${CAD_SERVER_IMAGE:-cadence-server:prod}"
    command: ["/app/bin/cadence", "eval", "Cadence.Server.Release.migrate()"]
    environment: *cadence-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot first-account bootstrap. It is idempotent and a no-op when
  # CAD_ADMIN_EMAIL/CAD_ADMIN_PASSWORD are empty, so every `up` is safe.
  bootstrap:
    image: "${CAD_SERVER_IMAGE:-cadence-server:prod}"
    command: ["/app/bin/cadence", "eval", "Cadence.Server.Release.bootstrap_admin()"]
    environment:
      <<: *cadence-env
      # Only this one-shot service sees the bootstrap password.
      CAD_ADMIN_EMAIL: "${CAD_ADMIN_EMAIL:-}"
      CAD_ADMIN_NAME: "${CAD_ADMIN_NAME:-}"
      CAD_ADMIN_PASSWORD: "${CAD_ADMIN_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  cadence:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: "${CAD_SERVER_IMAGE:-cadence-server:prod}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    # The app always listens on 4000 inside the container. Bind to loopback by
    # default: the bundled Caddy profile (or a host reverse proxy) reaches it
    # there. Set CAD_HTTP_BIND=0.0.0.0 only when a proxy on another host needs
    # direct access.
    ports:
      - "${CAD_HTTP_BIND:-127.0.0.1}:${CAD_HTTP_PORT:-4000}:4000"
    environment: *cadence-env
    volumes:
      - cadence_data:/data
      - cadence_actions:/data/actions
      - cadence_artifacts:/data/artifacts

  # Optional bundled TLS. Start it with `--profile tls`; the setup script does
  # this for auto/internal modes. The profile is off for an external proxy.
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    command:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile.${CAD_TLS_MODE:-auto}",
        "--adapter",
        "caddyfile"
      ]
    environment:
      CAD_PHX_HOST: "${CAD_PHX_HOST:?set CAD_PHX_HOST}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cadence:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${CAD_DB_USER:?set CAD_DB_USER}"
      POSTGRES_PASSWORD: "${CAD_DB_PASS:?set CAD_DB_PASS}"
      POSTGRES_DB: "${CAD_DB_NAME:-cadence}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAD_DB_USER} -d ${CAD_DB_NAME:-cadence}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Allowlisted Docker API proxy (spec §8.4). Never mount the raw socket into
  # the app container; this proxy is still root-equivalent on the host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      BUILD: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  cadence_data:
  # Pinned: the host daemon mounts this exact name into action containers
  # (§8.3/§12.4). Compose would otherwise prefix it with the project name.
  # Keep CAD_ACTIONS_VOLUME in sync; both read the same variable.
  cadence_actions:
    name: "${CAD_ACTIONS_VOLUME:-cadence_actions}"
  cadence_artifacts:
  postgres_data:
  caddy_data:
  caddy_config:
